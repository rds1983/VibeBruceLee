name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VibeBruceLee.slnx

      - name: Check formatting
        run: dotnet format VibeBruceLee.slnx whitespace --verify-no-changes --no-restore

      - name: Build
        run: dotnet build VibeBruceLee.slnx --configuration Release --no-restore

      - name: Verify generated assets
        run: |
          dotnet run --project Tools/VibeBruceLee.AssetGen --configuration Release --no-build --no-restore -- VibeBruceLee/Assets
          git diff --exit-code -- VibeBruceLee/Assets

      - name: Test
        run: dotnet test VibeBruceLee.slnx --configuration Release --no-build --logger "console;verbosity=normal"
